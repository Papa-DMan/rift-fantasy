services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: qwerpoiu
      POSTGRES_DB: lolesports_fantasy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lolesports_fantasy"]
      interval: 10s
      timeout: 5s
      retries: 5
  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: "admin@papadman.app"
      PGADMIN_DEFAULT_PASSWORD: qwerpoiu
    ports:
      - "5050:80"
    depends_on:
      - db
    volumes:
      - pgadmindata:/var/lib/pgadmin
  backend:
    depends_on:
      - db
    build:
      dockerfile: Dockerfile
      context: backend
    image: lolesports_fantasy_backend
  scraper:
    # Pulls schedule, games and player stats from lolesports into the db, then
    # refreshes fantasy points: every minute while a match is live, every 15
    # minutes otherwise. Same image as the backend.
    depends_on:
      - db
    build:
      dockerfile: Dockerfile
      context: backend
    image: lolesports_fantasy_backend
    command: ["python", "scraper.py"]
    restart: unless-stopped
  frontend:
    depends_on:
      - backend
    build:
      dockerfile: Dockerfile
      context: frontend
    image: lolesports_fantasy_frontend
  nginx:
    image: nginx:alpine
    depends_on:
      - frontend
      - backend
    container_name: Proxy
    volumes:
     - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # network_mode: "host"
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped

  
volumes:
  pgdata:
  pgadmindata: